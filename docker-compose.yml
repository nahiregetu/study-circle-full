services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studycircle
      POSTGRES_PASSWORD: studycircle
      POSTGRES_DB: studycircle
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studycircle"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://studycircle:studycircle@db:5432/studycircle
      JWT_SECRET: change-this-secret
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
  uploads:
